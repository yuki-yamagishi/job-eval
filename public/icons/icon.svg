<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="8" />

  <!-- Target & Scoring Shield Icon -->
  <g filter="url(#shadow)">
    <!-- Main Badge Shield -->
    <path d="M256 100 L380 155 V270 C380 345 325 410 256 430 C187 410 132 345 132 270 V155 Z" 
          fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Inner Accent (Score/Target Motif) -->
    <path d="M256 130 L355 175 V265 C355 325 312 378 256 395 C200 378 157 325 157 265 V175 Z" 
          fill="url(#bgGrad)" />
    
    <!-- Target Bullseye & Checkmark -->
    <circle cx="256" cy="265" r="55" fill="#ffffff" />
    <path d="M230 265 L248 283 L285 242" fill="none" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkle Stars for AI / Evaluation -->
  <path d="M370 120 Q370 145 395 145 Q370 145 370 170 Q370 145 345 145 Q370 145 370 120 Z" fill="#fbbf24" />
  <path d="M140 350 Q140 365 155 365 Q140 365 140 380 Q140 365 125 365 Q140 365 140 350 Z" fill="#fbbf24" />
</svg>
