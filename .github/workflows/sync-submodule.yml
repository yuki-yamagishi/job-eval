name: Auto Sync Submodule (antigravity-review-loop)

on:
  repository_dispatch:
    types:
      - antigravity-review-loop-updated
      - submodule-update
  schedule:
    - cron: '0 0 * * *' # 毎日 UTC 0:00 (JST 9:00) 定期実行
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-submodule:
    name: Sync antigravity-review-loop Submodule
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Update submodule to remote latest
        run: |
          git submodule update --init --remote --merge .agents/plugins/antigravity-review-loop

      - name: Check for submodule changes
        id: check_diff
        run: |
          if git diff --quiet .agents/plugins/antigravity-review-loop; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Submodule .agents/plugins/antigravity-review-loop is already up to date."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Submodule changes detected."
          fi

      - name: Install dependencies
        if: steps.check_diff.outputs.has_changes == 'true'
        run: npm ci

      - name: Run Full Quality Check (security + doc + tsc + vitest + vite build)
        if: steps.check_diff.outputs.has_changes == 'true'
        run: npm run check

      - name: Create or update Pull Request
        if: steps.check_diff.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="chore/update-antigravity-review-loop"
          SUBMODULE_COMMIT=$(git -C .agents/plugins/antigravity-review-loop rev-parse --short HEAD)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Checkout or create topic branch
          git checkout -B "$BRANCH_NAME"
          git add .agents/plugins/antigravity-review-loop
          git commit -m "chore(submodule): update antigravity-review-loop to ${SUBMODULE_COMMIT}"
          git push origin "$BRANCH_NAME" --force

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request #$EXISTING_PR already exists and was updated with new commit."
          else
            gh pr create \
              --head "$BRANCH_NAME" \
              --base main \
              --title "chore(submodule): update antigravity-review-loop to ${SUBMODULE_COMMIT}" \
              --body $'## 概要\n\n外部リポジトリ [antigravity-review-loop](https://github.com/yuki-yamagishi/antigravity-review-loop) の最新コミット (`'"$SUBMODULE_COMMIT"'`) への同期 PR です。\n\n## 品質ゲート検証\n- ワークフロー内にて `npm run check`（セキュリティ検査・ドキュメント検査・型検査・Vitest 単体テスト・プロダクションビルド）を全項目 PASS 済です。\n\n## マージについて\n人間による最終確認・マージをお願いします。'
          fi
