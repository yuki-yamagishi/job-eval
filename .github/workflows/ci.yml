name: CI Quality Gate & Automated Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Full Quality Gate (Frontend & Backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Full Quality Check (security + doc + tsc + vitest + vite build)
        run: npm run check

      - name: Upload production build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: production-dist
          path: dist
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages (Production)
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://job-eval.pages.dev

    steps:
      - name: Checkout repository (for functions and wrangler.jsonc)
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Download verified build artifact
        uses: actions/download-artifact@v8
        with:
          name: production-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@^3 pages deploy dist --project-name job-eval --branch main
